<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SkillSwap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <nav class="navbar"><div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark">S</span> Skill<span>Swap</span></a><a href="index.html" class="back-link">← Back to Home</a></div></nav>
    <main class="auth-area">
        <div class="auth-card signup-card">
            <h1>Skill<span>Swap</span></h1><h2>Create your account</h2><p class="auth-description">Join our community and start sharing skills.</p>
            <form id="signupForm">
                <div class="mb-3">
                   <label class="form-label" for="fullName">Full Name</label>
                   <input class="form-control" id="fullName" required placeholder="Enter your full name">
                </div>
                <div class="mb-3">
                   <label class="form-label" for="username">Username</label>
                   <input class="form-control" id="username" required placeholder="Choose a username">
                </div>
                <div class="mb-3">
                   <label class="form-label" for="signupEmail">Email Address</label>
                   <input class="form-control" type="email" id="signupEmail" required placeholder="Enter your email">
                </div>
                <div class="mb-3">
                   <label class="form-label" for="signupPassword">Password</label>
                   <input class="form-control" type="password" id="signupPassword" minlength="6" required placeholder="At least 6 characters">
                </div>
                <div class="mb-4">
                   <label class="form-label" for="confirmPassword">Confirm Password</label>
                   <input class="form-control" type="password" id="confirmPassword" minlength="6" required placeholder="Confirm your password">
                </div>
                <button class="btn btn-main w-100" type="submit">Create Account</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
