<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SkillSwap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <nav class="navbar">
       <div class="container">
         <a class="navbar-brand" href="index.html">
           <span class="brand-mark">
                 S
           </span> Skill<span>Swap</span>
         </a>
         <a href="index.html" class="back-link">
            ← Back to Home
         </a>
       </div>
    </nav>
    <main class="auth-area">

       <div class="auth-card">

         <h1>Skill<span>Swap</span></h1>
         <h2> Welcome Back!</h2>

         <p class="auth-description">
            Login to continue your learning journey.
         </p>

         <form id="loginForm">

           <div class="mb-3">

             <label class="form-label" for="loginEmail">Email Address</label>
             <input class="form-control" type="email" id="loginEmail" placeholder="Enter your email" required>

           </div>

           <div class="mb-4">

             <label class="form-label" for="loginPassword">Password</label>
             <input class="form-control" type="password" id="loginPassword" placeholder="Enter your password" required>

           </div>

           <button class="btn btn-main w-100" type="submit">Login</button>

       </form>
       <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
       <p class="demo-note">Demo frontend: any valid email and password will log you in on this browser.</p>
    </div>
</main>
    <script src="js/auth.js"></script>
</body>
</html>
